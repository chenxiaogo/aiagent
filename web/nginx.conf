# WebSocket 升级策略：
#   - 带 Upgrade 头的请求（聊天流式 / SSH 终端 / 流式命令执行）→ 转发 Connection: upgrade
#   - 普通请求（含 SSE）→ Connection: close（配合 proxy_buffering off 保证流式响应）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小限制：视频/文件上传，按需调整（单位 m）
    client_max_body_size 200m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API 代理到后端（REST + SSE + WebSocket 共用）
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级头（gorilla/websocket 需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 流式响应支持（SSE / MCP 长连接 / WebSocket 长空闲）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
