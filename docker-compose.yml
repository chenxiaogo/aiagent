# AI Agent 平台基础部署：仅 PostgreSQL + pgvector（后端/前端本地跑时用）
#
# 使用：
#   cp .env.example .env   # 可选，不复制则用默认值（密码 postgres、端口 5432）
#   docker compose up -d
#   或 make db-up
#
# 本地后端连接：host=127.0.0.1 port=5432 user=postgres password=postgres dbname=aiagent
#
# 数据目录：data/postgres_data（make init 自动创建并设置权限）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
      # 时区跟随宿主机
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aiagent-network

# 固定子网，避免与宿主机/其它 compose 项目网段冲突（如需更换改 subnet 即可）
networks:
  aiagent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
