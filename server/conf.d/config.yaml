app:
  name: aiagent
  env: dev

server:
  host: 0.0.0.0
  port: 8080

database:
  # pgvector (PostgreSQL with vector extension)
  driver: postgres
  dsn: "host=127.0.0.1 user=postgres password=postgres dbname=aiagent port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 2h
  # GORM SQL 日志级别：silent / error / warn / info（info 会打印所有 SQL）
  logLevel: info

security:
  jwtSecret: aiagent-secret-key
  tokenExpireHours: 24

logger:
  level: info
  filePath: ./logs
  maxSize: 100


# 文档分块配置
chunk:
  size: 512      # 每个分块的最大字符数
  overlap: 64    # 相邻分块的重叠字符数

# 向量搜索配置
vector:
  topK: 5        # 检索返回的 topK 个相似文档
  threshold: 0.7 # 相似度阈值